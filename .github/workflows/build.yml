name: Build Paige

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

# Default to read-only at the workflow scope; the release job opts in to write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # We never push from CI; don't leave a usable git credential on disk
        # where a later step (or a compromised action) could pick it up.
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Paige" --icon="assets/icon.ico" --add-data "assets;assets" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Paige-Windows
        path: dist/Paige.exe

  release:
    # Only publish releases for tag pushes, and only after a successful build.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Elevated permission is scoped to this job only.
    permissions:
      contents: write

    steps:
    - name: Download built artifact
      uses: actions/download-artifact@v4
      with:
        name: Paige-Windows
        path: dist

    - name: Create Release
      # Pinned to immutable commit SHA (v3.0.0). Bump deliberately, not via a
      # mutable tag — a hijacked `@v3` could exfiltrate GITHUB_TOKEN.
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        files: dist/Paige.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
