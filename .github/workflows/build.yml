name: Build Paige

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

# Default to read-only at the workflow scope; specific jobs opt in to more.
permissions:
  contents: read

jobs:
  test:
    # Pure-Python smoke tests on Ubuntu — no GUI dependencies, fast feedback.
    # Gates the (slower, Windows) build job.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pytest
      run: pip install pytest

    - name: Run smoke tests
      # `python -m pytest` (not bare `pytest`) so the CWD is added to
      # sys.path and `import paige_core` resolves.
      run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest

    # Build attestation needs id-token and attestations write; nothing else
    # in this job writes anywhere. Scoped to the job, not the workflow.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4
      with:
        # We never push from CI; don't leave a usable git credential on disk
        # where a later step (or a compromised action) could pick it up.
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Windows version metadata
      shell: pwsh
      run: |
        # Extract __version__ from paige_core.py via regex. Source of truth
        # lives there; main.py re-exports it for runtime use.
        $content = Get-Content paige_core.py -Raw
        if ($content -notmatch '__version__\s*=\s*"([^"]+)"') {
          Write-Error "Could not find __version__ in paige_core.py"
          exit 1
        }
        $version = $Matches[1]
        Write-Host "Building Paige version $version"

        # PyInstaller's VSVersionInfo wants a 4-tuple of ints.
        $parts = @($version.Split('.') | ForEach-Object { [int]$_ })
        while ($parts.Count -lt 4) { $parts += 0 }
        $verTuple = "(" + ($parts -join ', ') + ")"
        $verStr   = ($parts -join '.')

        $versionFile = @"
        VSVersionInfo(
          ffi=FixedFileInfo(
            filevers=$verTuple,
            prodvers=$verTuple,
            mask=0x3f,
            flags=0x0,
            OS=0x4,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
          ),
          kids=[
            StringFileInfo([
              StringTable('040904B0', [
                StringStruct('CompanyName', 'DQ-Labs'),
                StringStruct('FileDescription', 'Paige - a dumb text editor'),
                StringStruct('FileVersion', '$verStr'),
                StringStruct('InternalName', 'Paige'),
                StringStruct('OriginalFilename', 'Paige.exe'),
                StringStruct('ProductName', 'Paige'),
                StringStruct('ProductVersion', '$verStr'),
              ])
            ]),
            VarFileInfo([VarStruct('Translation', [1033, 1200])])
          ]
        )
        "@
        Set-Content -Path version.txt -Value $versionFile -Encoding utf8

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Paige" --icon="assets/icon.ico" --add-data "assets;assets" --version-file=version.txt main.py

    - name: Attest build provenance
      # Pinned to immutable commit SHA (v4.1.0). Generates a signed SLSA
      # attestation linking dist/Paige.exe to this workflow run + commit.
      # Users verify with: gh attestation verify Paige.exe --owner DQ-Labs
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: dist/Paige.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Paige-Windows
        path: dist/Paige.exe

  release:
    # Only publish releases for tag pushes, and only after a successful build.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Elevated permission is scoped to this job only.
    permissions:
      contents: write

    steps:
    - name: Download built artifact
      uses: actions/download-artifact@v4
      with:
        name: Paige-Windows
        path: dist

    - name: Create Release
      # Pinned to immutable commit SHA (v3.0.0). Bump deliberately, not via a
      # mutable tag — a hijacked `@v3` could exfiltrate GITHUB_TOKEN.
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        files: dist/Paige.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
